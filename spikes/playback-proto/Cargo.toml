[package]
name = "playback-proto"
description = "第一阶段播放引擎原型：验证解码 → 帧 → 渲染的可行性与成本"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gstreamer = { version = "0.25.4", features = ["v1_28"] }
gstreamer-app = { version = "0.25.2", features = ["v1_28"] }
gstreamer-video = { version = "0.25.4", features = ["v1_28"] }
png = "0.17"
gstreamer-pbutils = { version = "0.25", features = ["v1_28"] }
slint = { version = "1.19.0", default-features = false, features = [
  "std",
  "compat-1-2",
], optional = true }

[features]
default = ["slint"]
slint = ["dep:slint"]
