name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 播放引擎只用 libmpv（GStreamer 方案已弃用，见 docs/adr/0001）；
      # Slint 的 winit + femtovg 后端需要 fontconfig / xkbcommon / wayland 的开发包。
      - name: Install system dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libmpv-dev libclang-dev \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev fonts-noto-cjk

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  # 跨平台构建矩阵等界面落地（阶段 3）后再加：
  # - windows-latest: 需预装 GStreamer MSVC 运行时或改用 vcpkg
  # - macos-latest: brew install gstreamer mpv
  # 现在加进来只会产生"能编译但没人验证"的假绿。
