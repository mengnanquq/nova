name: 功能建议
description: 希望 Nova 新增或改变的功能
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Nova 目前处于预发布阶段，优先保证已有功能稳定。新功能会排期，但不一定马上做。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先说场景和痛点，再说方案。
      placeholder: 例如：我的剧集库很大，想在详情页直接跳到某一季。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 界面上怎么操作、用键盘怎么操作。

  - type: textarea
    id: alternatives
    attributes:
      label: 现在的替代办法
      description: 目前你是怎么绕过去的？其他客户端是怎么做的？

  - type: dropdown
    id: server
    attributes:
      label: 涉及的服务端
      multiple: true
      options:
        - Emby
        - Jellyfin
        - 与服务端无关
