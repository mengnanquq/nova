[package]
name = "nova-cli"
description = "Nova 命令行：登录、列媒体库、取播放地址、上报进度（阶段 2 出口条件的验证工具）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nova"
path = "src/main.rs"

[lib]
name = "nova_cli"
path = "src/lib.rs"

[dependencies]
# 工作区里有 nova-core / nova-secrets 的 workspace 依赖，另外两个只有 path，
# 这里统一写 path（允许本 crate 自己声明，避免改动根 Cargo.toml）。
nova-core = { path = "../nova-core" }
nova-provider = { path = "../nova-provider" }
nova-secrets = { path = "../nova-secrets" }
nova-storage = { path = "../nova-storage" }

reqwest = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
